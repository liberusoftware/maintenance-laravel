openapi: 3.1.0
info:
  title: maintenance reporting API
  version: 1.0.0
paths:
  /api/v1/maintenance/reporting/summary:
    get:
      operationId: maintenance.reporting.summary
      security:
        - sanctum: []
      responses:
        "200":
          description: Authorized reporting summary
  /api/v1/maintenance/reporting:
    get:
      operationId: maintenance.reporting.list
      security:
        - sanctum: []
      parameters:
        - {name: kind, in: query, schema: {type: string}}
        - {name: period_start, in: query, schema: {type: string, format: date-time}}
        - {name: period_end, in: query, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Authorized reporting records
    post:
      operationId: maintenance.reporting.create
      security:
        - sanctum: []
      responses:
        "201":
          description: Created reporting record
  /api/v1/maintenance/reporting/{id}/publish:
    post:
      operationId: maintenance.reporting.publish
      security:
        - sanctum: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Published reporting record
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
