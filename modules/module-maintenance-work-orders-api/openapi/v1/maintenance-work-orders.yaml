openapi: 3.1.0
info: {title: maintenance work orders API, version: 1.0.0}
paths:
  /api/v1/maintenance/work-orders/public:
    post:
      operationId: maintenance.work.orders.public.create
      security: []
      description: Submit a guest maintenance request to the configured public intake team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, priority, location, guest_name, guest_email]
              properties:
                title: {type: string, maxLength: 255}
                description: {type: string, maxLength: 2000}
                priority: {type: string, enum: [low, medium, high, critical]}
                location: {type: string, maxLength: 255}
                guest_name: {type: string, maxLength: 255}
                guest_email: {type: string, format: email}
                guest_phone: {type: string, nullable: true, maxLength: 64}
                equipment: {type: string, nullable: true, maxLength: 500}
      responses:
        '201': {description: Guest work order submitted}
        '503': {description: Public intake is disabled}
  /api/v1/maintenance/work-orders:
    get: {operationId: maintenance.work.orders.list, security: [{sanctum: []}], parameters: [{name: window, in: query, schema: {type: string, enum: [overdue, due_within]}}, {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 365}}, {name: assigned_to, in: query, schema: {type: integer, minimum: 1}}], responses: {'200': {description: Authorized work orders}}}
    post: {operationId: maintenance.work.orders.create, security: [{sanctum: []}], responses: {'201': {description: Work order created}}}
  /api/v1/maintenance/work-orders/{id}:
    get: {operationId: maintenance.work.orders.get, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Work order}}}
    patch: {operationId: maintenance.work.orders.update, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Work order updated}}}
    delete: {operationId: maintenance.work.orders.delete, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'204': {description: Work order deleted}}}
  /api/v1/maintenance/work-orders/{id}/transitions:
    post: {operationId: maintenance.work.orders.transition, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Work order transitioned}}}
  /api/v1/maintenance/work-orders/{id}/dependencies:
    get: {operationId: maintenance.work.orders.dependencies.list, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Work order dependencies}}
    post: {operationId: maintenance.work.orders.dependencies.create, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'201': {description: Dependency created}}}
  /api/v1/maintenance/work-orders/{id}/dependencies/{dependency}:
    delete: {operationId: maintenance.work.orders.dependencies.delete, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: dependency, in: path, required: true, schema: {type: string}}], responses: {'204': {description: Dependency removed}}}
  /api/v1/maintenance/work-orders/{id}/evidence:
    get: {operationId: maintenance.work.orders.evidence.list, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Work order evidence}}
    post: {operationId: maintenance.work.orders.evidence.create, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'201': {description: Evidence created}}}
  /api/v1/maintenance/work-orders/{id}/evidence/{evidence}:
    delete: {operationId: maintenance.work.orders.evidence.delete, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: evidence, in: path, required: true, schema: {type: string}}], responses: {'204': {description: Evidence removed}}}
  /api/v1/maintenance/work-orders/{id}/tasks:
    get: {operationId: maintenance.work.orders.tasks.list, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Work-order tasks}}
    post: {operationId: maintenance.work.orders.tasks.create, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'201': {description: Work-order task created}}}
  /api/v1/maintenance/work-orders/{id}/tasks/{task}/complete:
    post: {operationId: maintenance.work.orders.tasks.complete, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: task, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Work-order task completed}}}
components: {securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}}
