openapi: 3.1.0
info:
  title: Maintenance Core API
  version: 0.1.0
paths:
  /api/v1/maintenance/maintenance-core/organizations:
    get:
      operationId: maintenance.core.organizations.list
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Authorized organization collection }
    post:
      operationId: maintenance.core.organizations.create
      security: [{ sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '201': { description: Organization created }
  /api/v1/maintenance/maintenance-core/numbering/configure:
    post:
      operationId: maintenance.core.numbering.configure
      security: [{ sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_type, prefix]
              properties:
                document_type: { type: string, maxLength: 64 }
                prefix: { type: string, maxLength: 32 }
                padding: { type: integer, minimum: 1, maximum: 20, default: 6 }
      responses:
        '200': { description: Numbering sequence configured }
  /api/v1/maintenance/maintenance-core/numbering/issue:
    post:
      operationId: maintenance.core.numbering.issue
      security: [{ sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_type]
              properties:
                document_type: { type: string, maxLength: 64 }
      responses:
        '200': { description: Number issued }
  /api/v1/maintenance/maintenance-core/organizations/{id}:
    get:
      operationId: maintenance.core.organizations.get
      security: [{ sanctum: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Authorized organization }
        '404': { description: Concealed or missing resource }
    patch:
      operationId: maintenance.core.organizations.update
      security: [{ sanctum: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationPatch' }
      responses:
        '200': { description: Organization updated }
        '404': { description: Concealed or missing resource }
    delete:
      operationId: maintenance.core.organizations.delete
      security: [{ sanctum: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Organization deleted }
        '404': { description: Concealed or missing resource }
components:
  securitySchemes:
    sanctum: { type: http, scheme: bearer, bearerFormat: Sanctum }
  schemas:
    OrganizationInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        description: { type: [string, 'null'] }
    OrganizationPatch:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        code: { type: string, maxLength: 32 }
        description: { type: [string, 'null'] }
        state: { type: string, enum: [active, inactive] }
