openapi: 3.1.0
info: {title: maintenance procurement API, version: 1.0.0}
paths:
  /api/v1/maintenance/procurement:
    get: {operationId: maintenance.procurement.list, security: [{sanctum: []}], responses: {'200': {description: Authorized purchase requests}}}
    post: {operationId: maintenance.procurement.create, security: [{sanctum: []}], responses: {'201': {description: Purchase request created}}}
  /api/v1/maintenance/procurement/{id}:
    get: {operationId: maintenance.procurement.get, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Purchase request}}}
  /api/v1/maintenance/procurement/{id}/approve:
    post: {operationId: maintenance.procurement.approve, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Purchase request approved}}}
  /api/v1/maintenance/procurement/{id}/reject:
    post: {operationId: maintenance.procurement.reject, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Purchase request rejected}}}
  /api/v1/maintenance/procurement/{id}/transitions:
    post: {operationId: maintenance.procurement.transition, security: [{sanctum: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Purchase request lifecycle transitioned}}}
components: {securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}}
