openapi: 3.1.0
info: {title: maintenance inspections API, version: 1.0.0}
paths:
  /api/v1/maintenance/inspections:
    get: {operationId: maintenance.inspections.list, security: [{sanctum: []}], responses: {'200': {description: Authorized inspections}}}
    post: {operationId: maintenance.inspections.create, security: [{sanctum: []}], responses: {'201': {description: Inspection created}}}
  /api/v1/maintenance/inspections/{id}:
    get: {operationId: maintenance.inspections.get, security: [{sanctum: []}], responses: {'200': {description: Inspection}}}
    patch: {operationId: maintenance.inspections.update, security: [{sanctum: []}], responses: {'200': {description: Inspection updated}}}
    delete: {operationId: maintenance.inspections.delete, security: [{sanctum: []}], responses: {'204': {description: Inspection deleted}}}
  /api/v1/maintenance/inspections/{id}/complete:
    post: {operationId: maintenance.inspections.complete, security: [{sanctum: []}], responses: {'200': {description: Inspection completed}}}
components: {securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}}
