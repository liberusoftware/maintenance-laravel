openapi: 3.1.0
info:
  title: maintenance commercial API
  version: 1.0.0
paths:
  /api/v1/maintenance/commercial:
    get:
      operationId: maintenance.commercial.list
      security:
        - sanctum: []
      responses:
        "200":
          description: Authorized commercial records
    post:
      operationId: maintenance.commercial.create
      security:
        - sanctum: []
      responses:
        "201":
          description: Created commercial record
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

